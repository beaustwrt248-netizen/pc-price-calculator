<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC Price Calculator</title></head><body><script>(async()=>{try{let h=await fetch('./index.html?fix='+Date.now(),{cache:'no-store'}).then(r=>r.text());h=h.replace("lapAsk.addEventListener('input',()=>{if(+lapAsk.value>0)localStorage.setItem('pcpc_laptop_ask',lapAsk.value);else localStorage.removeItem('pcpc_laptop_ask')});\nconst savedLapAsk=localStorage.getItem('pcpc_laptop_ask');if(savedLapAsk&&!+lapAsk.value)lapAsk.value=savedLapAsk;","let LAST_LAP_ASK=0;\nfunction captureLaptopAsk(){const v=Number(document.getElementById('lapAsk').value);if(Number.isFinite(v)&&v>0){LAST_LAP_ASK=v;localStorage.setItem('pcpc_laptop_ask',String(v));}return LAST_LAP_ASK;}\nlapAsk.addEventListener('input',captureLaptopAsk);lapAsk.addEventListener('change',captureLaptopAsk);\nconst savedLapAsk=Number(localStorage.getItem('pcpc_laptop_ask')||0);if(savedLapAsk>0){LAST_LAP_ASK=savedLapAsk;if(!Number(lapAsk.value))lapAsk.value=String(savedLapAsk);}");h=h.replace("const askBeforeReset=+lapAsk.value||0;\n  if(askBeforeReset>0)localStorage.setItem('pcpc_laptop_ask',String(askBeforeReset));","const typedAsk=Number(document.getElementById('lapAsk').value);\n  const askBeforeReset=(Number.isFinite(typedAsk)&&typedAsk>0)?typedAsk:captureLaptopAsk();\n  if(askBeforeReset>0){LAST_LAP_ASK=askBeforeReset;localStorage.setItem('pcpc_laptop_ask',String(askBeforeReset));}");h=h.replace("const ask=+lapAsk.value||0,max=used*.70,offer=used*.65;","const ask=askBeforeReset,max=used*.70,offer=used*.65;");document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<p style="font-family:sans-serif;padding:20px">Could not load calculator: '+e.message+'</p>'}})();</script></body></html>
