<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>PC Price Calculator</title><style>html,body,#app{margin:0;width:100%;height:100%;border:0;background:#0b1020}#app{display:block}</style></head><body><iframe id="app" src="index.html?v=20260822-2255"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{try{const d=f.contentDocument,w=f.contentWindow,ask=d.getElementById('lapAsk');const saved=localStorage.getItem('pcpc_laptop_ask');if(saved&&ask&&!+ask.value)ask.value=saved;if(ask)ask.addEventListener('input',()=>{if(+ask.value>0)localStorage.setItem('pcpc_laptop_ask',ask.value);else localStorage.removeItem('pcpc_laptop_ask')});const btn=d.getElementById('lapAnalyse');if(!btn)return;const old=btn.onclick;btn.onclick=async ev=>{const before=+ask.value||0;if(before>0)localStorage.setItem('pcpc_laptop_ask',String(before));await old.call(btn,ev);if(before>0)ask.value=before;};}catch(e){console.error(e)}});</script></body></html>
